spring.application.name=CampusShare
# Database URL (Make sure to pre-create the empty schema 'shopcart_db' in MySQL Workbench/CLI first)
spring.datasource.url=jdbc:mysql://localhost:3306/shopcart_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Your local MySQL login credentials
spring.datasource.username=root

# Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable H2 Console (It does not work with external databases)
spring.h2.console.enabled=false

spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-ms=86400000

spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

